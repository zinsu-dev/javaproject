# Campus Courier — primary configuration (PostgreSQL, per spec).
# Run with Postgres:  ./mvnw spring-boot:run
# Run WITHOUT Postgres (H2 fallback): ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.application.name=CampusCourier

# --- PostgreSQL (override with environment variables in production) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campuscourier}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update = create/update tables automatically. Fine for MVP dev;
# use "validate" + migrations (Flyway) once you go to production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
