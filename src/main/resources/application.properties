# Campus Courier — PRIMARY configuration (PostgreSQL).
# Credentials ALWAYS come from the environment; the values after the
# colon are local-development defaults only, never production secrets.
# Run with Postgres:  ./mvnw spring-boot:run
# Run with logging:    ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Run WITHOUT Postgres (H2): ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.application.name=CampusCourier

# --- PostgreSQL (override with environment variables in production) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_courier}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# validate = Hibernate NEVER touches the schema; Flyway owns it.
# The app fails fast at startup if entities and migration drift apart.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Flyway: single source of truth for the schema ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
