# Repository tests run against H2 in PostgreSQL compatibility mode so the
# REAL Flyway migration (V1__create_initial_schema.sql, PostgreSQL dialect)
# executes here too — then Hibernate VALIDATES the entities against it.
# That proves entity mappings and migration agree.
# (H2 can never prove full PostgreSQL compatibility — a live-Postgres check
# is still needed before production. See README.)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
# Keep OUR datasource URL above instead of letting the test slice swap in
# a default embedded database (which would lose MODE=PostgreSQL).
spring.test.database.replace=none
